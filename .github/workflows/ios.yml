name: iOS build

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -quiet \
            -project ios/PadLink.xcodeproj -scheme PadLink \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PadLink.app Payload/
          ls Payload/PadLink.app/PlugIns
          zip -qry PadLink.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PadLink-ipa
          path: PadLink.ipa

      # iPad Safari에서 바로 받을 수 있게 고정 주소의 nightly 릴리스로 올린다
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly PadLink.ipa --prerelease \
            --title "Nightly" --notes "커밋 ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
